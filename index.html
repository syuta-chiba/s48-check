<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="問題チェック">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>問題チェック s1〜s48</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --sub:#86868b; --line:#e5e5ea;
  --o:#1f9d55; --x:#e0342f; --t:#e8a400; --run:#0a84ff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --sub:#8e8e93; --line:#2c2c2e; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  -webkit-user-select:none; user-select:none}
header{position:sticky; top:0; z-index:5; background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom:1px solid var(--line)}
.top{display:flex; gap:8px; align-items:center}
select,button{font:inherit; color:inherit}
select{flex:1; min-width:0; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:16px}
.btn{padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:15px}
.stats{display:flex; gap:6px; margin-top:8px; font-size:14px}
.stat{flex:1; text-align:center; padding:6px 0; border-radius:10px; background:var(--card); border:2px solid transparent}
.stat b{display:block; font-size:18px}
.stat.on{border-color:var(--fg)}
.stat.o b{color:var(--o)} .stat.x b{color:var(--x)} .stat.t b{color:var(--t)}
.total{margin-top:6px; font-size:13px; color:var(--sub); text-align:center}
main{padding:10px 12px calc(env(safe-area-inset-bottom) + 90px)}
.grid{display:flex; flex-direction:column; gap:6px}
.tile{display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:12px; padding:12px 16px; border:2px solid transparent}
.tile .id{font-weight:700; font-size:17px}
.tile .st{font-size:24px; font-weight:800; line-height:28px; color:var(--sub)}
.tile .st.none{font-size:14px; font-weight:400}
.tile.o{border-color:var(--o)} .tile.o .st{color:var(--o)}
.tile.x{border-color:var(--x)} .tile.x .st{color:var(--x)}
.tile.t{border-color:var(--t)} .tile.t .st{color:var(--t)}
.tile.running{border-color:var(--run); border-style:dashed}
.tile.running .st.none{color:var(--run)}
#detail{position:fixed; inset:0; z-index:10; background:var(--bg); display:none; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#detail.show{display:flex}
.dnav{display:flex; justify-content:space-between; align-items:center}
.dnav .btn{min-width:80px}
.dtitle{font-size:34px; font-weight:800; text-align:center; margin-top:24px}
.watch{font-size:72px; font-weight:300; text-align:center; font-variant-numeric:tabular-nums; margin:28px 0 8px}
.watch.on{color:var(--run)}
.hint{text-align:center; color:var(--sub); font-size:12px}
.ctrl{display:flex; justify-content:center; gap:36px; margin:28px 0}
.circle{width:88px; height:88px; border-radius:50%; border:none; font-size:18px; font-weight:600}
.circle.reset{background:var(--line)}
.circle.start{background:#1f9d55; color:#fff}
.circle.start.on{background:#e0342f}
.dmarks{display:flex; gap:12px; margin-top:auto}
.dm{flex:1; height:84px; border-radius:16px; border:3px solid var(--line); background:var(--card); font-size:40px; font-weight:800; color:var(--sub)}
.dm.o.on{background:var(--o); border-color:var(--o); color:#fff}
.dm.x.on{background:var(--x); border-color:var(--x); color:#fff}
.dm.t.on{background:var(--t); border-color:var(--t); color:#fff}
.dwhen{text-align:center; color:var(--sub); font-size:13px; margin-top:6px; line-height:1.6}
#ana{position:fixed; inset:0; z-index:10; background:var(--bg); display:none; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 24px); -webkit-user-select:text; user-select:text}
#ana.show{display:block}
#ana h2{font-size:15px; margin:20px 4px 8px; color:var(--sub); font-weight:600}
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.card{background:var(--card); border-radius:12px; padding:10px 12px}
.card .k{font-size:12px; color:var(--sub)}
.card .v{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.card .v small{font-size:13px; font-weight:400; color:var(--sub)}
.note{background:var(--card); border-radius:12px; padding:12px; font-size:14px; line-height:1.7}
table{width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:13px; font-variant-numeric:tabular-nums}
th,td{padding:8px 4px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left; padding-left:10px}
th{color:var(--sub); font-weight:500; font-size:12px}
tr:last-child td{border-bottom:none}
td.o{color:var(--o)} td.x{color:var(--x)} td.t{color:var(--t)}
.empty{color:var(--sub); text-align:center; padding:16px; font-size:14px}
.bk{margin-top:6px; font-size:12px; text-align:center; color:#b26a00}
.bk:empty{display:none}
footer{position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; background:var(--bg);
  padding:8px 12px calc(env(safe-area-inset-bottom) + 8px); border-top:1px solid var(--line)}
footer .btn{flex:1}
.toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff;
  padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top">
    <select id="round"></select>
    <button class="btn" id="newRound">＋新しい回</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="total" id="total"></div>
  <div class="bk" id="bk"></div>
</header>
<main id="list"></main>
<footer>
  <button class="btn" id="statsBtn">記録・分析</button>
  <button class="btn" id="copy">結果をコピー</button>
  <button class="btn" id="menu">回の管理</button>
</footer>
<div id="detail">
  <div class="dnav">
    <button class="btn" id="back">‹ 一覧</button>
    <div>
      <button class="btn" id="prev">‹ 前</button>
      <button class="btn" id="next">次 ›</button>
    </div>
  </div>
  <div class="dtitle" id="dtitle"></div>
  <div class="dwhen" id="dwhen"></div>
  <div class="watch" id="watch" data-act="edit">0:00</div>
  <div class="hint">時間をタップすると手で直せます</div>
  <div class="ctrl">
    <button class="circle reset" id="reset">リセット</button>
    <button class="circle start" id="start">スタート</button>
  </div>
  <div class="dmarks">
    <button class="dm o" data-m="o">○</button>
    <button class="dm x" data-m="x">×</button>
    <button class="dm t" data-m="t">△</button>
  </div>
</div>
<div id="ana">
  <div class="dnav"><button class="btn" id="anaBack">‹ 一覧</button><div style="font-weight:700">記録・分析</div><div style="width:80px"></div></div>
  <h2>データの保存（ファイル）</h2>
  <div class="note">
    <div id="bkInfo"></div>
    <div style="display:flex; gap:8px; margin-top:10px">
      <button class="btn" id="bkSave" style="flex:1">ファイルに保存</button>
      <button class="btn" id="bkLoad" style="flex:1">ファイルから戻す</button>
    </div>
    <input type="file" id="bkFile" accept=".json,application/json" style="display:none">
    <div class="hint" style="text-align:left; margin-top:8px">「ファイルに保存」→「"ファイル"に保存」で iCloud Drive などに置けます</div>
  </div>
  <div id="anaBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const N = 48;
const KEY = 's48-check-v1';
const IDS = Array.from({length:N}, (_,i) => 's' + (i+1));
const MARK = {o:'○', x:'×', t:'△'};

let db = load();
let filter = null; // null | 'o' | 'x' | 't' | 'none'

function newRound(name){ return {name, items:{}, running:null}; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && d.rounds && d.rounds.length) return d; }catch(e){}
  return {cur:0, rounds:[newRound('1回目')]};
}
function save(){ localStorage.setItem(KEY, JSON.stringify(db)); }
function R(){ return db.rounds[db.cur]; }
function item(id){ return R().items[id] || (R().items[id] = {t:0, m:null}); }

// 計測中の経過も含めた時間(ms)
function elapsed(id){
  const it = R().items[id]; let t = it ? it.t : 0;
  const run = R().running;
  if(run && run.id === id) t += Date.now() - run.start;
  return t;
}
function fmt(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(ss).padStart(2,'0');
}
function stop(){
  const run = R().running; if(!run) return;
  item(run.id).t += Date.now() - run.start;
  R().running = null;
}
function toggleRun(id){
  const run = R().running;
  const same = run && run.id === id;
  stop();
  if(!same){ R().running = {id, start: Date.now()}; if(!item(id).s) item(id).s = Date.now(); }
  save(); render();
}
function setMark(id, m){
  const it = item(id);
  it.m = it.m === m ? null : m;
  if(it.m) it.at = Date.now(); else delete it.at;
  // 印を付けたら、その問題の計測は止める
  if(it.m && R().running && R().running.id === id) stop();
  save(); render();
}
function editTime(id){
  const cur = fmt(elapsed(id));
  const v = prompt(id + ' の時間（例 3:25 / 秒数 / 空で0）', cur);
  if(v === null) return;
  const s = v.trim();
  let sec;
  if(s === '') sec = 0;
  else if(/^\d+(:\d{1,2}){0,2}$/.test(s)) sec = s.split(':').reduce((a,b) => a*60 + Number(b), 0);
  else { toast('形式が違います'); return; }
  if(R().running && R().running.id === id) R().running = null;
  item(id).t = sec * 1000;
  save(); render();
}

function render(){
  // 回の選択
  const sel = document.getElementById('round');
  sel.innerHTML = db.rounds.map((r,i) => `<option value="${i}">${esc(r.name)}</option>`).join('');
  sel.value = db.cur;

  // 集計
  const c = {o:0, x:0, t:0, none:0};
  let total = 0;
  IDS.forEach(id => { const it = R().items[id]; c[it && it.m ? it.m : 'none']++; total += elapsed(id); });
  document.getElementById('stats').innerHTML =
    ['o','x','t','none'].map(k => `<div class="stat ${k}${filter===k?' on':''}" data-f="${k}"><b>${c[k]}</b>${k==='none'?'未':MARK[k]}</div>`).join('');
  const done = N - c.none;
  const hasData = db.rounds.some(r => Object.values(r.items).some(it => it.m || it.t));
  const bkDays = db.backupAt ? Math.floor((Date.now() - db.backupAt) / 86400000) : null;
  document.getElementById('bk').textContent = hasData && (bkDays === null || bkDays >= 3)
    ? (bkDays === null ? 'まだファイルに保存していません' : `最後のファイル保存から ${bkDays} 日たっています`) + '（記録・分析 → ファイルに保存）' : '';
  document.getElementById('total').textContent =
    `合計 ${fmt(total)}　・　${done}/${N}問` + (done ? `　・　正答率 ${Math.round(c.o/done*100)}%` : '') +
    (filter ? '　（絞り込み中：もう一度タップで解除）' : '');

  // 一覧（問題と状態だけ）
  const run = R().running;
  document.getElementById('list').innerHTML = '<div class="grid">' + IDS.filter(id => {
    if(!filter) return true;
    const m = R().items[id] && R().items[id].m;
    return filter === 'none' ? !m : m === filter;
  }).map(id => {
    const m = (R().items[id] || {}).m; const on = run && run.id === id;
    return `<div class="tile${m?' '+m:''}${on?' running':''}" data-id="${id}">
      <div class="id">${id}</div>
      <div class="st${m?'':' none'}">${m ? MARK[m] : (on ? '計測中' : 'まだ')}</div>
    </div>`;
  }).join('') + '</div>';
  renderDetail();
}

// 問題の画面
let openId = null;
function openDetail(id){ openId = id; document.getElementById('detail').classList.add('show'); renderDetail(); }
function renderDetail(){
  if(!openId) return;
  const it = R().items[openId] || {}; const on = R().running && R().running.id === openId;
  document.getElementById('dtitle').textContent = openId;
  document.getElementById('dwhen').innerHTML =
    (it.s ? '開始 ' + dt(it.s) : 'まだ始めていません') + (it.at ? '<br>' + MARK[it.m] + 'を付けた日時 ' + dt(it.at) : '');
  const w = document.getElementById('watch');
  w.textContent = fmt(elapsed(openId)); w.classList.toggle('on', !!on);
  const st = document.getElementById('start');
  st.textContent = on ? 'ストップ' : (elapsed(openId) ? '再開' : 'スタート'); st.classList.toggle('on', !!on);
  document.querySelectorAll('.dm').forEach(b => b.classList.toggle('on', it.m === b.dataset.m));
  const i = IDS.indexOf(openId);
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === N-1;
}
function tick(){
  const run = R().running; if(!run) return;
  if(openId === run.id) document.getElementById('watch').textContent = fmt(elapsed(run.id));
  let total = 0; IDS.forEach(id => total += elapsed(id));
  const tt = document.getElementById('total');
  tt.textContent = tt.textContent.replace(/^合計 [\d:]+/, '合計 ' + fmt(total));
}
setInterval(tick, 250);

document.getElementById('list').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if(t) openDetail(t.dataset.id);
});
document.getElementById('back').addEventListener('click', () => {
  openId = null; document.getElementById('detail').classList.remove('show'); render();
});
document.getElementById('prev').addEventListener('click', () => { const i = IDS.indexOf(openId); if(i > 0) openDetail(IDS[i-1]); });
document.getElementById('next').addEventListener('click', () => { const i = IDS.indexOf(openId); if(i < N-1) openDetail(IDS[i+1]); });
document.getElementById('start').addEventListener('click', () => toggleRun(openId));
document.getElementById('reset').addEventListener('click', () => {
  if(R().running && R().running.id === openId) R().running = null;
  item(openId).t = 0; delete item(openId).s; save(); render();
});
document.getElementById('watch').addEventListener('click', () => editTime(openId));
document.querySelectorAll('.dm').forEach(b => b.addEventListener('click', () => setMark(openId, b.dataset.m)));
document.getElementById('stats').addEventListener('click', e => {
  const s = e.target.closest('[data-f]'); if(!s) return;
  filter = filter === s.dataset.f ? null : s.dataset.f; render();
});
document.getElementById('round').addEventListener('change', e => {
  stop(); db.cur = Number(e.target.value); save(); render();
});
document.getElementById('newRound').addEventListener('click', () => {
  const name = prompt('新しい回の名前', (db.rounds.length+1) + '回目');
  if(!name) return;
  stop(); db.rounds.push(newRound(name.trim())); db.cur = db.rounds.length-1; filter = null; save(); render();
});
document.getElementById('menu').addEventListener('click', () => {
  const v = prompt(`「${R().name}」をどうしますか？\n1: 名前を変える\n2: この回の記録を全部消す\n3: この回を削除する`);
  if(v === '1'){
    const n = prompt('新しい名前', R().name); if(n){ R().name = n.trim(); save(); render(); }
  }else if(v === '2'){
    if(confirm(`「${R().name}」の時間と印を全部消します。よろしいですか？`)){ R().items = {}; R().running = null; save(); render(); }
  }else if(v === '3'){
    if(db.rounds.length === 1){ toast('最後の1つは削除できません（2で記録を消せます）'); return; }
    if(confirm(`「${R().name}」を削除します。よろしいですか？`)){ db.rounds.splice(db.cur,1); db.cur = 0; save(); render(); }
  }
});
document.getElementById('copy').addEventListener('click', async () => {
  const lines = [R().name];
  IDS.forEach(id => { const it = R().items[id] || {}; lines.push(`${id}\t${fmt(elapsed(id))}\t${it.m ? MARK[it.m] : ''}\t${it.at ? dt(it.at) : ''}`); });
  lines.push(document.getElementById('total').textContent.replace(/　（.*$/, ''));
  const text = lines.join('\n');
  try{ await navigator.clipboard.writeText(text); toast('コピーしました（メモ等に貼り付けできます）'); }
  catch(e){ prompt('コピーしてください', text); }
});

const WD = '日月火水木金土';
function pad(n){ return String(n).padStart(2,'0'); }
function dt(ts){ const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${d.getHours()}:${pad(d.getMinutes())}`; }
function dayKey(ts){ const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dayLabel(k){ const d = new Date(k + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; }
function pct(a,b){ return b ? Math.round(a/b*100) + '%' : '—'; }
function card(k,v){ return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

// 印を付けた問題を全部の回から集める（日時のない古い記録は日別・ペースに入れない）
function attempts(){
  const out = [];
  db.rounds.forEach((r,ri) => IDS.forEach(id => {
    const it = r.items[id];
    if(it && it.m) out.push({ri, id, m:it.m, t:it.t, at:it.at});
  }));
  return out;
}
function renderAna(){
  const A = attempts();
  const cnt = a => ({o:a.filter(x=>x.m==='o').length, x:a.filter(x=>x.m==='x').length, t:a.filter(x=>x.m==='t').length, n:a.length,
                     time:a.reduce((s,x)=>s+x.t,0), timed:a.filter(x=>x.t>0).length});
  const all = cnt(A);
  const dated = A.filter(x => x.at);
  const days = {};
  dated.forEach(x => (days[dayKey(x.at)] = days[dayKey(x.at)] || []).push(x));
  const dayKeys = Object.keys(days).sort();
  let h = '';

  // 全体
  h += '<h2>全体（すべての回）</h2><div class="cards">';
  h += card('解いた問題', `${all.n}<small> 問</small>`);
  h += card('正答率（○の割合）', pct(all.o, all.n));
  h += card('○ / × / △', `<span style="color:var(--o)">${all.o}</span> / <span style="color:var(--x)">${all.x}</span> / <span style="color:var(--t)">${all.t}</span>`);
  h += card('1問の平均時間', all.timed ? fmt(all.time/all.timed) : '—');
  h += card('合計時間', fmt(all.time));
  h += card('勉強した日数', `${dayKeys.length}<small> 日</small>`);
  h += '</div>';

  // ペース（今の回）
  const r = R(); const cur = cnt(A.filter(x => x.ri === db.cur));
  const curDated = dated.filter(x => x.ri === db.cur);
  h += `<h2>ペース（${esc(r.name)}）</h2>`;
  if(curDated.length){
    const first = Math.min(...curDated.map(x=>x.at));
    const curDays = new Set(curDated.map(x => dayKey(x.at))).size;
    const spanDays = Math.floor((new Date(dayKey(Date.now())+'T00:00:00') - new Date(dayKey(first)+'T00:00:00'))/86400000) + 1;
    const perDay = curDated.length / spanDays;
    const perStudyDay = curDated.length / curDays;
    const left = N - cur.n;
    let finish = '';
    if(left === 0) finish = '全問終わりました';
    else { const d = Math.ceil(left / perDay); const f = new Date(Date.now() + d*86400000);
      finish = `このペースだと、残り ${left} 問はあと約 <b>${d} 日</b>（${f.getMonth()+1}/${f.getDate()}ごろ）で終わります`; }
    h += `<div class="cards">${card('進み具合', `${cur.n}<small> / ${N} 問</small>`)}${card('正答率', pct(cur.o, cur.n))}
      ${card('1日あたり（始めた日から）', `${perDay.toFixed(1)}<small> 問</small>`)}${card('勉強した日の平均', `${perStudyDay.toFixed(1)}<small> 問</small>`)}</div>
      <div class="note" style="margin-top:8px">${dt(first).split(' ')[0]} に始めて ${spanDays} 日目（うち勉強した日 ${curDays} 日）<br>${finish}</div>`;
  } else h += '<div class="note empty">この回は、まだ日時つきの記録がありません</div>';

  // 日別
  h += '<h2>日別</h2>';
  if(dayKeys.length){
    h += '<table><tr><th>日付</th><th>問</th><th>○</th><th>×</th><th>△</th><th>正答率</th><th>時間</th><th>平均</th></tr>';
    dayKeys.slice().reverse().forEach(k => { const c = cnt(days[k]);
      h += `<tr><td>${dayLabel(k)}</td><td>${c.n}</td><td class="o">${c.o}</td><td class="x">${c.x}</td><td class="t">${c.t}</td><td>${pct(c.o,c.n)}</td><td>${fmt(c.time)}</td><td>${c.timed?fmt(c.time/c.timed):'—'}</td></tr>`; });
    h += '</table>';
  } else h += '<div class="note empty">まだ記録がありません</div>';

  // 回別
  h += '<h2>回ごと</h2><table><tr><th>回</th><th>済</th><th>正答率</th><th>○</th><th>×</th><th>△</th><th>平均</th></tr>';
  db.rounds.forEach((rr,i) => { const c = cnt(A.filter(x => x.ri === i));
    h += `<tr><td>${esc(rr.name)}</td><td>${c.n}/${N}</td><td>${pct(c.o,c.n)}</td><td class="o">${c.o}</td><td class="x">${c.x}</td><td class="t">${c.t}</td><td>${c.timed?fmt(c.time/c.timed):'—'}</td></tr>`; });
  h += '</table>';

  if(A.length > dated.length) h += `<div class="hint" style="margin-top:12px">日時の記録を始める前に付けた ${A.length - dated.length} 問は、日別とペースには入っていません</div>`;
  h += '<div class="hint" style="margin-top:8px">正答率 = ○ ÷ 解いた問題（△は正解に入れていません）<br>日付は○×△を付けた日で数えています</div>';
  document.getElementById('anaBody').innerHTML = h;
  document.getElementById('bkInfo').textContent = db.backupAt ? '最後に保存した日時: ' + dt(db.backupAt) : 'まだファイルに保存していません';
}
document.getElementById('statsBtn').addEventListener('click', () => { renderAna(); document.getElementById('ana').classList.add('show'); });
document.getElementById('anaBack').addEventListener('click', () => document.getElementById('ana').classList.remove('show'));

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let tt; function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

// ファイルに保存 / ファイルから戻す
document.getElementById('bkSave').addEventListener('click', async () => {
  const now = new Date();
  const name = `s48-check_${dayKey(now)}_${pad(now.getHours())}${pad(now.getMinutes())}.json`;
  const prev = db.backupAt; db.backupAt = now.getTime();
  const text = JSON.stringify({app:'s48-check', version:1, savedAt:now.toISOString(), data:db}, null, 1);
  const file = new File([text], name, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
    save(); render(); renderAna(); toast('保存しました');
  }catch(e){ db.backupAt = prev; if(e.name !== 'AbortError') toast('保存できませんでした'); }
});
document.getElementById('bkLoad').addEventListener('click', () => document.getElementById('bkFile').click());
document.getElementById('bkFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{
    const j = JSON.parse(await f.text());
    const d = j && j.app === 's48-check' ? j.data : null;
    if(!d || !Array.isArray(d.rounds) || !d.rounds.length) throw 0;
    const n = d.rounds.reduce((a,r) => a + Object.values(r.items || {}).filter(it => it.m).length, 0);
    if(!confirm(`${f.name}\n（${d.rounds.length}回分・印 ${n} 問）\n\n今の記録をこのファイルの内容に置き換えます。よろしいですか？`)) return;
    d.cur = Math.min(d.cur || 0, d.rounds.length - 1);
    db = d; save(); filter = null; render(); renderAna(); toast('ファイルから戻しました');
  }catch(err){ toast('このアプリの保存ファイルではありません'); }
});

render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
