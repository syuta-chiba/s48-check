<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="勉強管理">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>勉強管理</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --fg:#1d1d1f; --sub:#6e6e73; --line:#e5e5ea;
  --o:#1f9d55; --x:#e0342f; --t:#e8a400; --run:#0a84ff; --good:#0ca30c;
  /* 科目の色（カテゴリ色・固定の順番） */
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100; --c4:#e87ba4; --c5:#008300; --c6:#6250d6; --c7:#e34948; --c8:#8a8a85;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --sub:#98989d; --line:#2c2c2e;
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#008300; --c6:#9085e9; --c7:#e66767; --c8:#6e6e6a; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; -webkit-user-select:none; user-select:none}
button,select,input{font:inherit; color:inherit}
.btn{padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:15px}
.btn.sm{font-size:13px; padding:6px 10px}
.btn.wide{display:block; width:100%; margin-top:8px; padding:12px}
.btn.primary{background:var(--run); border-color:var(--run); color:#fff}
.btn:disabled{opacity:.4}
select{padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:16px}

/* 画面 */
.view{display:none; padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 150px)}
.view.show{display:block}
h1.ttl{font-size:26px; margin:4px 2px 12px}
h2{font-size:15px; margin:22px 4px 8px; color:var(--sub); font-weight:600}
.cards{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.card{background:var(--card); border-radius:12px; padding:10px 12px}
.card .k{font-size:12px; color:var(--sub)}
.card .v{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.card .v small,.big small{font-size:13px; font-weight:400; color:var(--sub)}
.note{background:var(--card); border-radius:12px; padding:12px; font-size:14px; line-height:1.7}
.big{font-size:34px; font-weight:700; font-variant-numeric:tabular-nums}
.hint{color:var(--sub); font-size:12px; line-height:1.6}
.empty{color:var(--sub); text-align:center; padding:16px; font-size:14px}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:baseline}
.rows{background:var(--card); border-radius:12px; overflow:hidden}
.rowi{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px; border-bottom:1px solid var(--line); font-size:15px}
.rowi:last-child{border-bottom:none}
.rowi .r{color:var(--sub); font-variant-numeric:tabular-nums; text-align:right}
.meter{height:8px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:8px}
.meter i{display:block; height:100%; border-radius:4px; background:var(--run)}
.meter.done i{background:var(--good)}
.ok{color:var(--good); font-weight:600}
.late{color:var(--x); font-weight:600}
.subjbtns{display:grid; grid-template-columns:repeat(2,1fr); gap:8px}
.subjbtn{display:flex; align-items:center; gap:8px; padding:14px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:16px; font-weight:600; text-align:left}
.subjbtn .pl{margin-left:auto; color:var(--sub); font-size:14px}
.runcard{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:2px solid var(--run); border-radius:14px; padding:12px 14px}
.runcard .big{color:var(--run)}
.plan{background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px}
.plan .h{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.plan .n{font-weight:700}
.plan .s{font-size:13px; color:var(--sub); margin-top:4px; line-height:1.6}
.book{background:var(--card); border-radius:12px; padding:12px; margin-bottom:8px}
.book .n{font-weight:700; font-size:16px}
.book .s{font-size:13px; color:var(--sub); margin-top:4px}

/* 下のタブ */
#tabs{position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex; background:var(--bg); border-top:1px solid var(--line);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 4px)}
#tabs button{flex:1; border:none; background:none; padding:6px 0; font-size:11px; color:var(--sub)}
#tabs button b{display:block; font-size:20px; line-height:24px}
#tabs button.on{color:var(--run)}
#runbar{position:fixed; left:10px; right:10px; z-index:8; bottom:calc(env(safe-area-inset-bottom) + 66px); display:none;
  align-items:center; gap:10px; background:var(--card); border:2px solid var(--run); border-radius:14px; padding:8px 8px 8px 14px; box-shadow:0 4px 16px rgba(0,0,0,.12)}
#runbar.show{display:flex}
#runbar .l{flex:1; min-width:0; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#runbar .t{font-weight:700; color:var(--run); font-variant-numeric:tabular-nums; font-size:18px}
#runbar button{border:none; border-radius:10px; background:var(--x); color:#fff; padding:8px 12px; font-weight:600}

/* 重ねる画面 */
.layer{position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch}
.layer.show{display:flex}
#book{z-index:10} #detail,#ana{z-index:20} #form{z-index:30}
.lhead{position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 8px) 12px 8px; border-bottom:1px solid var(--line)}
.dnav{display:flex; justify-content:space-between; align-items:center; gap:8px}
.dnav .mid{font-weight:700; flex:1; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.top{display:flex; gap:8px; align-items:center; margin-top:8px}
.top select{flex:1; min-width:0}
.stats{display:flex; gap:6px; margin-top:8px; font-size:14px}
.stat{flex:1; text-align:center; padding:6px 0; border-radius:10px; background:var(--card); border:2px solid transparent}
.stat b{display:block; font-size:18px}
.stat.on{border-color:var(--fg)}
.stat.o b{color:var(--o)} .stat.x b{color:var(--x)} .stat.t b{color:var(--t)}
.total{margin-top:6px; font-size:13px; color:var(--sub); text-align:center}
.lbody{padding:10px 12px calc(env(safe-area-inset-bottom) + 90px)}
.grid{display:flex; flex-direction:column; gap:6px}
.tile{display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:12px; padding:12px 16px; border:2px solid transparent}
.tile .id{font-weight:700; font-size:17px}
.tile .p{font-weight:600; color:var(--sub)}
.tile .right{display:flex; align-items:center; gap:14px}
.tile .tm{font-size:15px; color:var(--sub); font-variant-numeric:tabular-nums}
.tile .st{min-width:32px; text-align:center; font-size:24px; font-weight:800; line-height:28px; color:var(--sub)}
.tile .st.none{font-size:14px; font-weight:400}
.tile.o{border-color:var(--o)} .tile.o .st{color:var(--o)}
.tile.x{border-color:var(--x)} .tile.x .st{color:var(--x)}
.tile.t{border-color:var(--t)} .tile.t .st{color:var(--t)}
.tile.running{border-color:var(--run); border-style:dashed}
.tile.running .tm,.tile.running .st.none{color:var(--run); font-weight:600}
.tile.cont{margin-top:-3px}
.lfoot{position:fixed; left:0; right:0; bottom:0; display:flex; gap:6px; background:var(--bg);
  padding:8px 12px calc(env(safe-area-inset-bottom) + 8px); border-top:1px solid var(--line)}
.lfoot .btn{flex:1; font-size:14px; padding:8px 4px}

#detail{padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.dsub{text-align:center; color:var(--sub); font-size:13px; margin-top:18px}
.dtitle{font-size:34px; font-weight:800; text-align:center; margin-top:2px}
.dwhen{text-align:center; color:var(--sub); font-size:13px; margin-top:6px; line-height:1.6}
.dsplit{display:block; margin:10px auto 0; font-size:13px; padding:6px 12px}
.watch{font-size:72px; font-weight:300; text-align:center; font-variant-numeric:tabular-nums; margin:20px 0 4px}
.watch.on{color:var(--run)}
.ctrl{display:flex; justify-content:center; gap:36px; margin:24px 0}
.circle{width:88px; height:88px; border-radius:50%; border:none; font-size:18px; font-weight:600; flex:none}
.circle.reset{background:var(--line)}
.circle.start{background:#1f9d55; color:#fff}
.circle.start.on{background:#e0342f}
.runcard .circle{width:72px; height:72px; font-size:15px}
.dmarks{display:flex; gap:12px; margin-top:auto}
.dm{flex:1; height:84px; border-radius:16px; border:3px solid var(--line); background:var(--card); font-size:40px; font-weight:800; color:var(--sub)}
.dm.o.on{background:var(--o); border-color:var(--o); color:#fff}
.dm.x.on{background:var(--x); border-color:var(--x); color:#fff}
.dm.t.on{background:var(--t); border-color:var(--t); color:#fff}

table{width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:13px; font-variant-numeric:tabular-nums}
th,td{padding:8px 4px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th:first-child,td:first-child{text-align:left; padding-left:10px}
td.wrap{white-space:normal; text-align:left; color:var(--sub); font-size:12px; line-height:1.6}
th{color:var(--sub); font-weight:500; font-size:12px}
tr:last-child td{border-bottom:none}
td.o{color:var(--o)} td.x{color:var(--x)} td.t{color:var(--t)}
#ana .lbody,#v-log,#v-set{-webkit-user-select:text; user-select:text}

/* グラフ */
.chart{background:var(--card); border-radius:12px; padding:10px 8px 6px}
.chart svg{display:block; width:100%; height:auto}
.chart text{font-size:10px; fill:var(--sub)}
.chart .gl{stroke:var(--line); stroke-width:1}
.chart .col.sel .hit{fill:var(--line)}
.tip{min-height:44px; font-size:13px; line-height:1.6; padding:2px 6px 8px}
.tip b{font-variant-numeric:tabular-nums}
.legend{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; padding:4px 6px 4px}

/* 入力フォーム */
#form{background:rgba(0,0,0,.35); justify-content:flex-end}
#form .sheet{background:var(--bg); border-radius:16px 16px 0 0; width:100%; max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height:90vh; overflow-y:auto}
#form h3{margin:0 0 12px; font-size:18px}
#form label{display:block; font-size:13px; color:var(--sub); margin-bottom:12px}
#form input,#form select{display:block; width:100%; margin-top:4px; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--card); font-size:16px; -webkit-user-select:text; user-select:text; min-height:44px}
#form small{display:block; margin-top:4px; font-size:12px}
#form .fbtns{display:flex; gap:8px; margin-top:4px}
#form .fbtns .btn{flex:1; padding:12px}
#form .fdel{width:100%; margin-top:12px; color:var(--x); background:none; border:none; padding:10px}

.toast{position:fixed; z-index:40; left:50%; bottom:140px; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff;
  padding:10px 16px; border-radius:20px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<section class="view" id="v-home"></section>
<section class="view" id="v-books"></section>
<section class="view" id="v-log"></section>
<section class="view" id="v-set"></section>

<div id="runbar"><div class="l" id="runLabel"></div><div class="t" data-live="run"></div><button data-act="stopRun">ストップ</button></div>
<nav id="tabs">
  <button data-act="tab" data-tab="home"><b>⌂</b>ホーム</button>
  <button data-act="tab" data-tab="books"><b>▤</b>教材</button>
  <button data-act="tab" data-tab="log"><b>▥</b>記録</button>
  <button data-act="tab" data-tab="set"><b>⚙</b>設定</button>
</nav>

<!-- 教材の問題一覧 -->
<div class="layer" id="book">
  <div class="lhead">
    <div class="dnav"><button class="btn" data-act="closeBook">‹ 教材</button><div class="mid" id="bTitle"></div><button class="btn" data-act="editBook">設定</button></div>
    <div class="top"><select id="round"></select><button class="btn" data-act="newRound">＋新しい回</button></div>
    <div class="stats" id="bStats"></div>
    <div class="total" id="bTotal"></div>
  </div>
  <div class="lbody" id="bList"></div>
  <div class="lfoot">
    <button class="btn" data-act="openAna">分析</button>
    <button class="btn" data-act="copyBook">結果をコピー</button>
    <button class="btn" data-act="roundMenu">回の管理</button>
  </div>
</div>

<!-- 問題ごとの画面 -->
<div class="layer" id="detail">
  <div class="dnav">
    <button class="btn" data-act="closeDetail">‹ 一覧</button>
    <div><button class="btn" data-act="prevQ" id="prevQ">‹ 前</button> <button class="btn" data-act="nextQ" id="nextQ">次 ›</button></div>
  </div>
  <div class="dsub" id="dSub"></div>
  <div class="dtitle" id="dTitle"></div>
  <div class="dwhen" id="dWhen"></div>
  <button class="btn dsplit" data-act="split" id="dSplit"></button>
  <div class="watch" id="watch" data-act="editTime">0:00</div>
  <div class="hint" style="text-align:center">時間をタップすると手で直せます</div>
  <div class="ctrl">
    <button class="circle reset" data-act="resetQ">リセット</button>
    <button class="circle start" data-act="toggleQ" id="startQ">スタート</button>
  </div>
  <div class="dmarks">
    <button class="dm o" data-act="mark" data-m="o">○</button>
    <button class="dm x" data-act="mark" data-m="x">×</button>
    <button class="dm t" data-act="mark" data-m="t">△</button>
  </div>
</div>

<!-- 教材の分析 -->
<div class="layer" id="ana">
  <div class="lhead"><div class="dnav"><button class="btn" data-act="closeAna">‹ 一覧</button><div class="mid" id="aTitle"></div><div style="width:60px"></div></div></div>
  <div class="lbody" id="aBody"></div>
</div>

<!-- 入力フォーム -->
<div class="layer" id="form">
  <div class="sheet">
    <h3></h3>
    <div class="fields"></div>
    <div class="fbtns"><button class="btn" data-f="cancel">やめる</button><button class="btn primary" data-f="ok">決定</button></div>
    <button class="fdel" data-f="del"></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="bkFile" accept=".json,application/json" style="display:none">

<script src="app.js?v=20261125004849" id="appjs"></script>
</body>
</html>
